<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Parmar Family — Invitation | 12 &amp; 13 Oct 2026</title>
<meta name="description" content="Parmar Family invites you to celebrate — 12 &amp; 13 October 2026">

<!-- Fonts: Cormorant Garamond (English display), Yatra One (Hindi display), Mukta (body, Latin + Devanagari) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Yatra+One&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
</head>
<body>
<!-- ============ INTRO / OPENING SCREEN ============ -->
<section id="intro" class="intro" aria-label="Opening">
  <div class="intro-bg" aria-hidden="true"></div>
  <div class="intro-particles" id="introParticles" aria-hidden="true"></div>

  <div class="intro-content">
    <div class="ganesh-wrap" aria-hidden="true">
      <div class="ganesh-glow"></div>
      <img src="ganesh.png" alt="">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E9C67B"/>
            <stop offset="100%" stop-color="#B8860B"/>
          </linearGradient>
        </defs>
        <!-- simple ornamental line-art silhouette of Ganesh -->
        <g fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M110 20c-16 0-26 12-26 26 0 8 3 14 8 19-14 4-24 16-24 32 0 9 4 16 10 21-16 5-27 20-27 39 0 24 26 38 59 38s59-14 59-38c0-19-11-34-27-39 6-5 10-12 10-21 0-16-10-28-24-32 5-5 8-11 8-19 0-14-10-26-26-26z"/>
          <ellipse cx="88" cy="118" rx="10" ry="14"/>
          <ellipse cx="132" cy="118" rx="10" ry="14"/>
          <path d="M110 108c6 10 8 22 2 34-4 8-4 16 2 21"/>
          <path d="M114 163c8 4 18 3 24-4"/>
          <path d="M70 96c-14-2-24 6-24 18"/>
          <path d="M150 96c14-2 24 6 24 18"/>
          <path d="M62 150c-10 6-14 18-8 28"/>
          <path d="M158 150c10 6 14 18 8 28"/>
          <circle cx="110" cy="12" r="5" fill="url(#goldGrad)" stroke="none"/>
          <path d="M60 205c16 10 34 15 50 15s34-5 50-15" />
        </g>
      </svg>
      <div class="floral-ring" aria-hidden="true">
        <span class="petal p1">✿</span><span class="petal p2">❀</span><span class="petal p3">✿</span>
        <span class="petal p4">❀</span><span class="petal p5">✿</span><span class="petal p6">❀</span>
      </div>
    </div>

    <p class="intro-om reveal-item">ॐ श्री गणेशाय नमः</p>
    <h1 class="intro-family reveal-item" data-i18n="introFamily"></h1>
    <p class="intro-line reveal-item" data-i18n="introLine"></p>
    <p class="intro-hindi reveal-item" data-i18n="introSub"></p>

    <button type="button" id="enterBtn" class="btn btn-primary intro-enter reveal-item">
      <span data-i18n="enter"></span>
    </button>
  </div>
</section>


<button type="button" id="langToggle" class="lang-toggle" aria-label="Switch language">हिन्दी</button>

<div id="main-content" class="main-content" hidden>
  <nav class="site-nav" aria-label="Section navigation">
    <a href="#welcome" data-i18n="navHome"></a>
    <a href="#events" data-i18n="navEvents"></a>
    <a href="#venue" data-i18n="navVenue"></a>
    <a href="#contact" data-i18n="navContact"></a>
  </nav>

  <button type="button" id="musicToggle" class="music-toggle" aria-pressed="false" aria-label="Play background music">
    <span class="music-icon" aria-hidden="true">♫</span><span class="music-label" data-i18n="music"></span>
  </button>
  <audio id="bgAudio" loop preload="none"><source src="instrument.mp3" type="audio/mpeg"></audio>

  <section id="welcome" class="section welcome-section">
    <div class="ornament-divider top" aria-hidden="true"><svg viewBox="0 0 300 40"><path d="M0 20 Q75 0 150 20 T300 20" fill="none" stroke="#B8860B" stroke-width="1.5"/><circle cx="150" cy="20" r="5" fill="#B8860B"/></svg></div>
    <p class="eyebrow-soft" data-i18n="bless"></p>
    <h2 class="family-name" data-i18n="familyName"></h2>
    <p class="welcome-copy" data-i18n="welcome"></p>
    <div class="mandala-wrap" aria-hidden="true"><svg class="mandala" viewBox="0 0 200 200"><g fill="none" stroke="#C9A227" stroke-width="1"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="70"/><circle cx="100" cy="100" r="50"/><g id="mandalaPetals"></g></g></svg></div>
  </section>

  <section id="events" class="section events-section">
    <h2 class="section-title" data-i18n="eventsTitle"></h2>

    <article class="date-card date-card--one">
      <header class="date-card-header"><span class="date-num" data-i18n="d1"></span><span class="date-tag" data-i18n="d1tag"></span></header>
      <ul class="event-list">
        <li class="event-item"><span class="event-icon" aria-hidden="true">🪔</span><div class="event-text"><h3 data-i18n="e1"></h3><p class="event-meta" data-i18n="e1m"></p></div></li>
        <li class="event-item"><span class="event-icon" aria-hidden="true">🌸</span><div class="event-text"><h3 data-i18n="e2"></h3><p class="event-meta" data-i18n="e2m"></p></div></li>
      </ul>
    </article>

    <article class="date-card date-card--two">
      <header class="date-card-header"><span class="date-num" data-i18n="d2"></span><span class="date-tag" data-i18n="d2tag"></span></header>
      <ul class="event-list">
        <li class="event-item"><span class="event-icon" aria-hidden="true">💍</span><div class="event-text"><h3 data-i18n="e3"></h3><p class="event-meta" data-i18n="e3m"></p></div></li>
       
      </ul>
    </article>

    <article class="date-card pratibhoj-card">
      <header class="date-card-header"><span class="date-num" data-i18n="pTag"></span><span class="date-tag" data-i18n="d2short"></span></header>
      <ul class="event-list">
        <li class="event-item"><span class="event-icon" aria-hidden="true">🍽️</span><div class="event-text"><h3 data-i18n="pTitle"></h3><p class="event-meta" data-i18n="pTime"></p><p class="event-meta" data-i18n="pWhere"></p></div></li>
      </ul>
      <a class="btn btn-primary map-link" href="#" target="_blank" rel="noopener" data-i18n="openMaps"></a>
    </article>
  </section>

  <section class="section engagement-section">
    <div class="ring-motif" aria-hidden="true"><svg viewBox="0 0 120 60"><circle cx="40" cy="30" r="18" fill="none" stroke="#B8860B" stroke-width="2.5" class="ring-draw"/><circle cx="72" cy="30" r="18" fill="none" stroke="#6B1420" stroke-width="2.5" class="ring-draw ring-draw-delay"/></svg></div>
    <p class="eyebrow-soft" data-i18n="engEyebrow"></p>
    <h2 class="section-title" data-i18n="e3"></h2>
    <div class="engagement-photo" aria-hidden="true"><div class="photo-placeholder"><span><img src="image11.png" alt=""></span></div></div>
    <dl class="engagement-details">
      <div><dt data-i18n="lCouple"></dt><dd data-i18n="couple"></dd></div>
      <div><dt data-i18n="lDate"></dt><dd data-i18n="d2"></dd></div>
      <div><dt data-i18n="lTime"></dt><dd data-i18n="e3t"></dd></div>
      <div><dt data-i18n="lVenue"></dt><dd data-i18n="venueName"></dd></div>
    </dl>
  </section>


  <section id="contact" class="section contact-section">
    <h2 class="section-title" data-i18n="contactTitle"></h2>
    <div class="contact-actions">
      <a class="btn btn-outline" href="tel:+917879850970">📞 7879850970</a>
      <a class="btn btn-outline" href="tel:+918103174459">📞 8103174459</a>
      <a class="btn btn-outline" href="https://wa.me/917879850970" target="_blank" rel="noopener">💬 WhatsApp</a>
    </div>
  </section>

  <section class="section closing-section">
    <p class="closing-line" data-i18n="closing"></p>
    <p class="closing-signature" data-i18n="sign"></p>
    <svg class="closing-ganesh" viewBox="0 0 100 60" aria-hidden="true"><text x="50" y="35" text-anchor="middle" font-size="14" fill="#B8860B" font-family="'Yatra One', serif">ॐ</text></svg>
    <div class="ornament-divider bottom" aria-hidden="true"><svg viewBox="0 0 300 40"><path d="M0 20 Q75 40 150 20 T300 20" fill="none" stroke="#B8860B" stroke-width="1.5"/></svg></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="script.js"></script>
</body>
</html>
